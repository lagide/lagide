[package]
name = "lagide"
version = "0.1.0"
edition = "2021"
description = "A unified terminal tool combining WSL2 management and MobaXterm-like features"
authors = ["Lagide"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH
ssh2 = "0.9"

# Serialization (config/sessions)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# System info
sysinfo = "0.32"

# Directories (config paths)
dirs = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
